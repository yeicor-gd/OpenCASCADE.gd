# https://medium.com/@aarne.laur/retry-failed-github-actions-8661e7601c66
name: Retry workflow

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
jobs:
  rerun:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: rerun ${{ inputs.run_id }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          # Wait for the target run to finalize (it may still be in progress).
          gh run watch "${RUN_ID}" || true
          CONCLUSION="$(gh run view "${RUN_ID}" --json conclusion --jq '.conclusion' || true)"
          echo "Target run ${RUN_ID} conclusion: ${CONCLUSION}"
          case "${CONCLUSION}" in
            success)
              echo "Run already succeeded, nothing to rerun."
              ;;
            failure)
              # Re-run only the failed jobs; fall back to a full re-run if
              # GitHub refuses (e.g. no failed jobs eligible for re-run).
              gh run rerun "${RUN_ID}" --failed || gh run rerun "${RUN_ID}"
              ;;
            *)
              # Cancelled runs have no *failed* jobs: 'rerun --failed' exits 0
              # while silently scheduling nothing (cancelled jobs are skipped),
              # so only a full re-run can revive them.
              gh run rerun "${RUN_ID}"
              ;;
          esac
